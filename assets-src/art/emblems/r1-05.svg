<svg xmlns="http://www.w3.org/2000/svg" width="512" height="640" viewBox="0 0 512 640">
<!-- Region 1, variant 5: roundel, motif 2, field #56694A, pale. Made by tools/art/emblems.mjs. -->
<defs>
  <clipPath id="shape"><path d="M256 92 A220 220 0 1 1 255.9 92 Z"/></clipPath>
  <linearGradient id="gold" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#F6DA86"/><stop offset="0.5" stop-color="#D9A640"/><stop offset="1" stop-color="#A9782E"/>
  </linearGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0.16"/><stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    <stop offset="1" stop-color="#000" stop-opacity="0.32"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#bfb6a2"/><stop offset="0.45" stop-color="#8A7A55"/><stop offset="1" stop-color="#3e3726"/>
  </linearGradient>
  <!-- Painted relief: a highlight from the top left on every raised edge, a soft shadow below. -->
  <filter id="relief" x="-15%" y="-15%" width="130%" height="130%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
    <feSpecularLighting in="blur" surfaceScale="5" specularConstant="0.75" specularExponent="16" lighting-color="#fff" result="spec">
      <feDistantLight azimuth="225" elevation="40"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
    <feComposite in="SourceGraphic" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.6" k4="0" result="lit"/>
    <feOffset in="SourceAlpha" dx="4" dy="7" result="off"/>
    <feGaussianBlur in="off" stdDeviation="5" result="offBlur"/>
    <feFlood flood-color="#000" flood-opacity="0.45"/>
    <feComposite in2="offBlur" operator="in" result="shadow"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="lit"/></feMerge>
  </filter>
  <filter id="grain" x="0" y="0" width="1" height="1">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="18"/>
    <feColorMatrix values="0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 0 0.17  0 0 0 0.14 0"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
</defs>

<g filter="url(#relief)">
  <g clip-path="url(#shape)">
    <rect width="512" height="640" fill="#56694A"/>
    <rect x="256" y="0" width="256" height="640" fill="#6e7e63"/>
    <rect width="512" height="640" fill="url(#shade)"/>
    <rect width="512" height="640" fill="#fff" filter="url(#grain)"/>
  </g>
  <path d="M256 92 A220 220 0 1 1 255.9 92 Z" fill="none" stroke="url(#rim)" stroke-width="22"/>
  <path d="M256 92 A220 220 0 1 1 255.9 92 Z" fill="none" stroke="#2A211A" stroke-width="5"/>
</g>
<g filter="url(#relief)" transform="translate(256 312) scale(0.92)">
        <g transform="translate(-66 92) rotate(-40)">
    <path d="M0 0 C -34 -40 -30 -100 0 -128 C 30 -100 34 -40 0 0Z" fill="#A9B98A" stroke="#2A211A" stroke-width="5"/>
    <path d="M0 -6 V-118" stroke="#2A211A" stroke-width="3"/></g><g transform="translate(66 92) rotate(40)">
    <path d="M0 0 C 34 -40 30 -100 0 -128 C -30 -100 -34 -40 0 0Z" fill="#A9B98A" stroke="#2A211A" stroke-width="5"/>
    <path d="M0 -6 V-118" stroke="#2A211A" stroke-width="3"/></g>
        <path d="M-8 -132 H8 V110 H-8Z" fill="#7A5B3E" stroke="#2A211A" stroke-width="5"/>
        <ellipse cx="0" cy="96" rx="52" ry="16" fill="#E3D6B8" stroke="#2A211A" stroke-width="6"/>
        <ellipse cx="0" cy="-10" rx="44" ry="62" fill="url(#gold)" stroke="#2A211A" stroke-width="6"/>
        <path d="M-40 -34 C 0 -24 0 -24 40 -34 M-44 -6 C 0 4 0 4 44 -6 M-40 22 C 0 32 0 32 40 22" fill="none" stroke="#9C6E25" stroke-width="5"/></g>
</svg>