# CI: lint, typecheck, unit + golden tests, room validation, the web build, and a browser test of a
# first visit on the production build (landing → onboarding → Prologue → Floor 1's first room). The
# full play-through of every room (tools/shots/play) runs locally: it takes too long for CI minutes.
# Deploys are done by Cloudflare itself from the GitHub repo (wrangler.jsonc), not from here.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm rooms:validate
      - run: pnpm build
      - run: pnpm --filter @wirelight/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7
